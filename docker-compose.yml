services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: lmu
      POSTGRES_USER: lmu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lmu -d lmu"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "3891:3001"
    volumes:
      - ./backend/src:/app/src
      - ./data:/data
    environment:
      DATA_DIR: /data
      PORT: 3001
      DATABASE_URL: postgresql://lmu:${POSTGRES_PASSWORD}@postgres:5432/lmu
      COOKIE_SECRET: ${COOKIE_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    environment:
      BACKEND_URL: http://backend:3001
    depends_on:
      - backend

volumes:
  pgdata:
